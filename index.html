<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privātais kabinets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-blue: #004a99;
            --dark-blue: #003366;
            --light-gray: #f5f7fa;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
            --bg-white: #ffffff;
            --border-color: #e0e0e0;
        }

        [data-theme="dark"] {
            --primary-blue: #1a1a1a;
            --dark-blue: #0d0d0d;
            --light-gray: #1e1e1e;
            --text-dark: #e0e0e0;
            --text-light: #ffffff;
            --bg-white: #121212;
            --border-color: #2a2a2a;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-white);
            color: var(--text-dark);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Augšējā josla */
        .top-bar {
            background-color: var(--primary-blue);
            color: var(--text-light);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 100;
            transition: background-color 0.3s;
        }

        .company-name {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .datetime {
            font-size: 0.95rem;
            font-weight: 500;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 6px;
        }

        /* Galvenais saturs */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Kreisā sānu josla */
        .sidebar {
            width: 90px;
            background-color: var(--dark-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 15px;
            transition: background-color 0.3s;
        }

        .sidebar-btn {
            width: 65px;
            height: 65px;
            background-color: transparent;
            border: 2px solid transparent;
            border-radius: 12px;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            gap: 3px;
            font-size: 0.65rem;
            font-weight: 500;
            text-decoration: none;
        }

        .sidebar-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .sidebar-btn.active {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: var(--text-light);
        }

        .sidebar-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .sidebar-btn span {
            font-size: 0.6rem;
            text-align: center;
            line-height: 1;
        }

        /* Satura zona */
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--bg-white);
            transition: background-color 0.3s;
        }

        .content h1 {
            color: var(--primary-blue);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .content p {
            color: var(--text-dark);
            line-height: 1.6;
            opacity: 0.85;
        }

        /* Iestatījumu panelis */
        .settings-panel {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--light-gray);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            max-width: 500px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .settings-panel h2 {
            color: var(--primary-blue);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }

        .theme-toggle label {
            font-size: 1rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-blue);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Paslēptas sekcijas */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Augšējā josla -->
    <header class="top-bar">
        <div class="company-name">SIA "Uzņēmuma Nosaukums"</div>
        <div class="datetime" id="datetime"></div>
    </header>

    <!-- Galvenais konteiners -->
    <div class="main-container">

        <!-- Kreisā sānu josla -->
        <aside class="sidebar">
            <a href="#galvenais" class="sidebar-btn active" onclick="showPage('galvenais', this); return false;">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>Galvenais</span>
            </a>

            <!-- Instrumenti - sūta uz citu linku -->
            <a href="instrumenti.html" class="sidebar-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
                </svg>
                <span>Instrumenti</span>
            </a>

            <!-- Dati - sūta uz citu linku -->
            <a href="dati.html" class="sidebar-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
                </svg>
                <span>Dati</span>
            </a>

            <!-- Sagataves - sūta uz citu linku -->
            <a href="sagataves.html" class="sidebar-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
                    <path d="M8 10h2v2H8zm4 0h2v2h-2zm4 0h2v2h-2z"/>
                </svg>
                <span>Sagataves</span>
            </a>

            <!-- Iestatījumi - paliek iekšējā sadaļa -->
            <a href="#iestatijumi" class="sidebar-btn" onclick="showPage('iestatijumi', this); return false;">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
                <span>Iestatījumi</span>
            </a>
        </aside>

        <!-- Satura zona -->
        <main class="content">

            <!-- Galvenais ekrāns -->
            <div id="galvenais" class="page active">
                <h1>🏠 Galvenais ekrāns</h1>
                <p>Laipni lūdzam privātajā kabinetā! Šeit ir sistēmas pārskats.</p>
            </div>

            <!-- Iestatījumi -->
            <div id="iestatijumi" class="page">
                <h1>⚙️ Iestatījumi</h1>
                <p>Pielāgojiet sistēmas izskatu un uzvedību.</p>

                <div class="settings-panel">
                    <h2>Izskata iestatījumi</h2>
                    <div class="theme-toggle">
                        <label class="switch">
                            <input type="checkbox" id="themeSwitch" onchange="toggleTheme()">
                            <span class="slider"></span>
                        </label>
                        <label for="themeSwitch">Tumšais režīms</label>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // Datuma un laika atjaunināšana
        function updateDateTime() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const formatted = now.toLocaleString('lv-LV', options).replace(',', '');
            document.getElementById('datetime').textContent = formatted;
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);

        // Lapu pārslēgšana (tikai iekšējām sadaļām - Galvenais, Iestatījumi)
        function showPage(pageId, link) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            link.classList.add('active');
        }

        // Tēmas pārslēgšana
        function toggleTheme() {
            const isDark = document.getElementById('themeSwitch').checked;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }
    </script>

</body>
</html>
